# Databricks Asset Bundle (DAB) configuration for Databricks Free Edition.
#
# Free Edition is serverless-only — no classic clusters, no node_type_id,
# no num_workers. Tasks below omit cluster configuration entirely, which
# tells the Jobs API to run them on serverless compute.
#
# Deploy:
#   databricks bundle deploy
#   databricks bundle run medallion_test_job

bundle:
  name: medallion-testing

variables:
  catalog:
    description: Unity Catalog target catalog (Free Edition default is 'workspace')
    default: workspace

targets:
  default:
    mode: development
    default: true
    workspace:
      host: https://dbc-252798a7-44b9.cloud.databricks.com

resources:
  jobs:

    # -------------------------------------------------------------------
    # Pytest job — runs the test suite on serverless compute.
    # The notebook installs pytest/chispa via %pip, so no task-level
    # libraries are required here.
    # -------------------------------------------------------------------
    medallion_test_job:
      name: medallion_tests
      tasks:
        - task_key: run_pytest
          notebook_task:
            notebook_path: ../notebooks/run_tests_on_databricks

    # -------------------------------------------------------------------
    # Pipeline job — TEMPLATE for when you have real data and a wheel build.
    # Currently commented out because it needs two things that don't exist
    # in this repo on Free Edition:
    #   1. medallion_testing-0.1.0-py3-none-any.whl
    #      Add a setup.py / pyproject.toml and `python -m build` to produce it.
    #   2. Unity Catalog volumes with landed CSV/JSON data:
    #      /Volumes/<catalog>/landing/claims/
    #      /Volumes/<catalog>/landing/members/
    # Uncomment once both are in place.
