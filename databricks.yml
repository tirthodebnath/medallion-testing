# Databricks Asset Bundle (DAB) configuration for Databricks Free Edition.
#
# Deploy:
#   databricks bundle deploy
#   databricks bundle run medallion_test_job

bundle:
  name: medallion-testing

variables:
  catalog:
    description: Unity Catalog target catalog
    default: workspace
  schema:
    description: Unity Catalog target schema
    default: tirtho_db
  volume:
    description: Volume for raw landing data
    default: tirtho_uploaded_files

targets:
  default:
    mode: development
    default: true
    workspace:
      host: https://dbc-252798a7-44b9.cloud.databricks.com

resources:
  jobs:

    # -------------------------------------------------------------------
    # Pytest job — runs the test suite on serverless compute.
    # -------------------------------------------------------------------
    medallion_test_job:
      name: medallion_tests
      tasks:
        - task_key: run_pytest
          notebook_task:
            notebook_path: ../notebooks/run_tests_on_databricks

    # -------------------------------------------------------------------
    # Pipeline job — reads raw CSVs from the Volume, runs the full
    # Bronze -> Silver -> Gold pipeline, writes output to Delta tables.
    #
    # Before running:
    #   1. Upload claims.csv and members.csv to:
    #      /Volumes/workspace/tirtho_db/tirtho_uploaded_files/claims/
    #      /Volumes/workspace/tirtho_db/tirtho_uploaded_files/members/
    #   2. databricks bundle deploy
    #   3. databricks bundle run medallion_pipeline_job
    # -------------------------------------------------------------------
    medallion_pipeline_job:
      name: medallion_pipeline
      tasks:
        - task_key: run_pipeline
          notebook_task:
            notebook_path: ../notebooks/run_pipeline
