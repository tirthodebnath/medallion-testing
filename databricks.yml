# Databricks Asset Bundle (DAB) configuration.
#
# Two jobs are defined:
#   1. medallion_pipeline_job — runs the end-to-end pipeline.
#   2. medallion_test_job     — runs pytest as a job (PR / nightly use).
#
# Deploy:
#   databricks bundle deploy --target dev
#   databricks bundle run medallion_test_job --target dev

bundle:
  name: medallion-testing

variables:
  catalog:
    description: Unity Catalog target catalog
    default: dev_catalog
  cluster_id:
    description: Existing cluster ID used by both jobs (override per-env)
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-XXXXXXXXXXXXX.azuredatabricks.net
    variables:
      catalog: dev_catalog
  prod:
    mode: production
    workspace:
      host: https://adb-YYYYYYYYYYYYY.azuredatabricks.net
    variables:
      catalog: prod_catalog

resources:
  jobs:

    # -------------------------------------------------------------------
    # 1. The actual pipeline job
    # -------------------------------------------------------------------
    medallion_pipeline_job:
      name: medallion_pipeline_${bundle.target}
      tasks:
        - task_key: run_pipeline
          job_cluster_key: pipeline_cluster
          python_wheel_task:
            package_name: medallion_testing
            entry_point: pipeline_main         # entry point declared in setup.py
            parameters:
              - "--claims-path"
              - "/Volumes/${var.catalog}/landing/claims/"
              - "--members-path"
              - "/Volumes/${var.catalog}/landing/members/"
          libraries:
            - whl: ../dist/medallion_testing-0.1.0-py3-none-any.whl
      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
            data_security_mode: SINGLE_USER

    # -------------------------------------------------------------------
    # 2. The pytest job — invoked on every PR + nightly
    # -------------------------------------------------------------------
    medallion_test_job:
      name: medallion_tests_${bundle.target}
      tasks:
        - task_key: run_pytest
          job_cluster_key: test_cluster
          notebook_task:
            notebook_path: ../notebooks/run_tests_on_databricks
          libraries:
            - pypi: { package: "pytest==8.3.3" }
            - pypi: { package: "chispa==0.10.1" }
            - pypi: { package: "pytest-html==4.1.1" }
      job_clusters:
        - job_cluster_key: test_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
            data_security_mode: SINGLE_USER
