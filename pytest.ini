[pytest]
# `tests/` is the test root; collect everything under it.
testpaths = tests

# Add repo root to sys.path so `from src...` imports work without any
# external setup. This means `pytest` "just works" from the repo root
# regardless of import mode, virtualenv, or how the notebook is launched.
pythonpath = .

# Custom markers used in the suite.
markers =
    integration: tests that hit real Delta tables on disk (slower)

# Sensible defaults:
#   -ra        short summary of non-passing tests
#   --tb=short compact tracebacks
#   --strict-markers   typos in markers fail the run
#   --import-mode=importlib   modern import mode; no package-init gymnastics
addopts = -ra --tb=short --strict-markers --import-mode=importlib

# Quiet down Py4J warnings from PySpark
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
